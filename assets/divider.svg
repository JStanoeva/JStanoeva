<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" aria-hidden="true">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a4fd8" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#8a4fd8" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#f06fb3" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="0.6" stop-color="#f06fb3" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#8a4fd8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8a4fd8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#f06fb3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8a4fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="comet-l" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe9a8"/>
    </linearGradient>
    <linearGradient id="comet-r" x1="1" x2="0" y1="0" y2="0">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe9a8"/>
    </linearGradient>
    <path id="sparkle" d="M0 -16 C1.6 -4 4 -1.6 16 0 C4 1.6 1.6 4 0 16 C-1.6 4 -4 1.6 -16 0 C-4 -1.6 -1.6 -4 0 -16 Z"/>
  </defs>

  <style>
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4.8s ease-in-out infinite; }
    .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 4.8s ease-in-out infinite; }
    .comet-l { animation: comet-l 4.8s cubic-bezier(.5, 0, .6, 1) infinite; }
    .comet-r { animation: comet-r 4.8s cubic-bezier(.5, 0, .6, 1) infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes pulse { 0%, 55%, 100% { transform: scale(1); } 72% { transform: scale(1.22); } }
    @keyframes breathe { 0%, 55%, 100% { opacity: .55; transform: scale(.9); } 72% { opacity: 1; transform: scale(1.15); } }
    @keyframes comet-l {
      0% { transform: translateX(0); opacity: 0; }
      12% { opacity: 1; }
      62% { transform: translateX(450px); opacity: .9; }
      70%, 100% { transform: translateX(450px); opacity: 0; }
    }
    @keyframes comet-r {
      0% { transform: translateX(0); opacity: 0; }
      12% { opacity: 1; }
      62% { transform: translateX(-450px); opacity: .9; }
      70%, 100% { transform: translateX(-450px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Two beams of stardust flowing toward the centre -->
  <rect x="40" y="27" width="520" height="2" rx="1" fill="url(#beam)"/>
  <rect x="640" y="27" width="520" height="2" rx="1" fill="url(#beam)"/>

  <rect class="comet-l" x="40" y="26.5" width="70" height="3" rx="1.5" fill="url(#comet-l)"/>
  <rect class="comet-r" x="1090" y="26.5" width="70" height="3" rx="1.5" fill="url(#comet-r)"/>

  <!-- Scattered stars -->
  <g>
    <circle class="twinkle" cx="128" cy="19" r="1.4" fill="#b48cff" style="animation-delay:-.4s"/>
    <circle class="twinkle" cx="196" cy="37" r="1.1" fill="#f06fb3" style="animation-delay:-2.1s"/>
    <circle class="twinkle" cx="262" cy="22" r="1.8" fill="#f5c542" style="animation-delay:-1.2s"/>
    <circle class="twinkle" cx="341" cy="38" r="1.3" fill="#b48cff" style="animation-delay:-2.8s"/>
    <circle class="twinkle" cx="418" cy="17" r="1.2" fill="#f06fb3" style="animation-delay:-.9s"/>
    <circle class="twinkle" cx="486" cy="36" r="1.6" fill="#f5c542" style="animation-delay:-3.1s"/>
    <circle class="twinkle" cx="714" cy="20" r="1.6" fill="#f5c542" style="animation-delay:-1.7s"/>
    <circle class="twinkle" cx="786" cy="38" r="1.2" fill="#f06fb3" style="animation-delay:-.2s"/>
    <circle class="twinkle" cx="859" cy="18" r="1.3" fill="#b48cff" style="animation-delay:-2.5s"/>
    <circle class="twinkle" cx="938" cy="35" r="1.8" fill="#f5c542" style="animation-delay:-1.4s"/>
    <circle class="twinkle" cx="1004" cy="21" r="1.1" fill="#f06fb3" style="animation-delay:-3.3s"/>
    <circle class="twinkle" cx="1072" cy="37" r="1.4" fill="#b48cff" style="animation-delay:-.7s"/>
    <use class="twinkle" href="#sparkle" transform="translate(300 13) scale(.32)" fill="#f5c542" style="animation-delay:-1.9s"/>
    <use class="twinkle" href="#sparkle" transform="translate(900 43) scale(.32)" fill="#f5c542" style="animation-delay:-.5s"/>
    <use class="twinkle" href="#sparkle" transform="translate(170 44) scale(.24)" fill="#f06fb3" style="animation-delay:-2.9s"/>
    <use class="twinkle" href="#sparkle" transform="translate(1030 12) scale(.24)" fill="#f06fb3" style="animation-delay:-1.1s"/>
  </g>

  <!-- Little diamonds guarding the light -->
  <rect x="563" y="25" width="6" height="6" transform="rotate(45 566 28)" fill="#8a4fd8"/>
  <rect x="631" y="25" width="6" height="6" transform="rotate(45 634 28)" fill="#8a4fd8"/>
  <rect x="545.5" y="26.5" width="3" height="3" transform="rotate(45 547 28)" fill="#f06fb3"/>
  <rect x="651.5" y="26.5" width="3" height="3" transform="rotate(45 653 28)" fill="#f06fb3"/>

  <!-- The light at the centre -->
  <g class="breathe"><circle cx="600" cy="28" r="26" fill="url(#glow)"/></g>
  <g transform="translate(600 28) rotate(45) scale(.6)"><use href="#sparkle" fill="#f06fb3" opacity=".85"/></g>
  <g class="pulse"><use href="#sparkle" transform="translate(600 28)" fill="#f5c542"/></g>
</svg>
